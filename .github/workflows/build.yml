name: Build apps

# Builds one Android app per entry in apps.json and publishes them on the "apps" release page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.read.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: |
          python3 tools/check_apps.py apps.json
          echo "apps=$(python3 -c 'import json; print(json.dumps(json.load(open("apps.json"))))')" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
    env:
      APP_ID: ${{ matrix.app.id }}
      APP_NAME: ${{ matrix.app.name }}
      APP_URL: ${{ matrix.app.url }}
      APP_COLOR: ${{ matrix.app.color }}
      APP_LABEL: ${{ matrix.app.label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Draw the icon
        run: |
          pip install --quiet pillow==11.0.0
          python3 tools/make_icon.py "$APP_ID" "$APP_LABEL" "$APP_COLOR" app/src/main/res

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret: the app is signed with a throwaway key, so updates will need an uninstall first."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          gradle --no-daemon assembleRelease
          -PappId="$APP_ID" -PappName="$APP_NAME" -PappUrl="$APP_URL" -PappColor="$APP_COLOR"
          -PversionCode=${{ github.run_number }}

      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$APP_ID.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-${{ matrix.app.id }}
          path: out/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: apks
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > notes.md
          import json
          apps = json.load(open("apps.json"))
          print("Download the app you want on your Android phone, open it and allow installing.\n")
          for a in apps:
              print(f"- **{a['name']}** → `{a['id']}.apk` (opens {a['url']})")
          print("\nSign in to Claude with email and code inside each app.")
          print("\nSHA-256 of each file (to check a download is genuine):\n```")
          import hashlib, glob, os
          for f in sorted(glob.glob("apks/*.apk")):
              print(hashlib.sha256(open(f, "rb").read()).hexdigest(), os.path.basename(f))
          print("```")
          PY
          gh release delete apps --cleanup-tag --yes || true
          gh release create apps apks/*.apk --title "Artifact apps" --notes-file notes.md --latest
